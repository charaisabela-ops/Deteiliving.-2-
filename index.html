<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Detailiving Cali</title>
</head>

<body>
    <section id="login">
        <h2> Iniciar sesion </h2>

        <form id="form-login">
            <label> Correo </label>
            <input type="email" id="login-email">

            <label> Contraseña </label>
            <input type="password" id="clave">

            <button> Entrar </button>

        </form>
        <p id="login-mensaje"></p>

    </section>
    <section id="app" hidden>

        <h1>Nueva cotización</h1>

        <form id="form-cotizacion">
            <label>Nombre del cliente</label>
            <input type="text" id="nombre">

            <label>Correo</label>
            <input type="email" id="email">

            <label>Tel</label>
            <input type="tel" id="tel">

            <label>Servicios</label>
            <select id="servicio">
                <option>Lavado de mueble</option>
                <option>Colchón</option>
                <option>Sillas del comedor</option>
            </select>

            <button type="submit">Guardar</button>
        </form>

        <p id="resultado"></p>

    </section>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const db = supabase.createClient("https://wohifbcjbnjxypmhqgzl.supabase.co", "sb_publishable_wbWFHCm5US-SisFXMgiR1Q_74zfmUHX");
        const formularioLogin = document.querySelector("#form-login");
        formularioLogin.addEventListener("submit", async function (evento) {
            evento.preventDefault();
            const correologin = document.querySelector("#login-email").value;
            const clave = document.querySelector("#clave").value;
            const respuesta = await db.auth.signInWithPassword({ email: correologin, password: clave });

            if (respuesta.error) {
                document.querySelector("#login-mensaje").textContent = "Correo o contraseña incorrectos";
            }
            else {
                document.querySelector("#login").hidden = true;
                document.querySelector("#app").hidden = false;
            }
        });
        const formulario = document.querySelector("#form-cotizacion");

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();
            const nombre = document.querySelector("#nombre").value;
            const email = document.querySelector("#email").value;
            const tel = document.querySelector("#tel").value;

            const respuesta = await db.from("clientes").insert({ nombre: nombre, correo: email, telefono: tel });
            if (respuesta.error) {
                document.querySelector("#resultado").textContent = "No se pudo guardar. Intente de nuevo";

            } else { document.querySelector("#resultado").textContent = "Cliente guardado con exito  " }
        });
    </script>
</body>

</html>
